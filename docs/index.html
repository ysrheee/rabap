<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>라밥</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --brand:#FF6B35;--brand-press:#E85A26;--brand-tint:#FFF1EB;
  --g900:#191F28;--g800:#333D4B;--g700:#4E5968;--g600:#6B7684;--g500:#8B95A1;--g400:#B0B8C1;--g300:#D1D6DB;--g200:#E5E8EB;--g100:#F2F4F6;--g50:#F9FAFB;
  --green:#00C471;--green-tint:#E8F9F1;--red:#F04452;--red-tint:#FDEDEE;
  --r:16px;--nav:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:clip}
html,body{margin:0;background:#fff;color:var(--g900);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;font-size:15px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
#app{max-width:480px;margin:0 auto;min-height:100vh}
.page{padding:12px 20px 32px}
.top{display:flex;align-items:center;height:52px;margin:0 -4px}
.back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--g800);text-decoration:none;border-radius:50%}
.back:active{background:var(--g100)}
h1{font-size:24px;line-height:1.35;margin:16px 0 6px;font-weight:700;letter-spacing:-.02em}
h2{font-size:17px;margin:28px 0 12px;font-weight:700}
p{margin:0}
.sub{color:var(--g600);font-size:14px}
.cap{color:var(--g500);font-size:13px}
.sec{background:var(--g100);border-radius:20px;padding:20px;margin-top:16px}
.sec.white{background:#fff;border:1px solid var(--g200)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border:0;border-radius:14px;font-size:17px;font-weight:600;background:var(--brand);color:#fff;text-decoration:none;cursor:pointer;transition:transform .08s,background .08s;font-family:inherit}
.btn:active{background:var(--brand-press);transform:scale(.985)}
.btn.sub2{background:var(--g100);color:var(--g800)}
.btn.sub2:active{background:var(--g200)}
.btn.line{background:#fff;color:var(--g800);border:1px solid var(--g200);height:50px;font-size:15px}
.btn:disabled{background:var(--g200);color:var(--g400);transform:none}
.cta{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,#fff 70%,rgba(255,255,255,0));max-width:480px;margin:0 auto}
.cta.nav-on{bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
.field{margin-top:18px}
.field label{display:block;font-size:13px;color:var(--g600);margin-bottom:8px;font-weight:500}
.field input{width:100%;height:56px;border:2px solid transparent;border-radius:14px;padding:0 16px;font-size:18px;font-weight:500;background:var(--g100);outline:0;color:var(--g900);font-family:inherit;transition:border-color .12s,background .12s}
.field input:focus{border-color:var(--brand);background:#fff}
.field input::placeholder{color:var(--g400);font-weight:400}
.err{color:var(--red);font-size:13px;margin-top:10px;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
.chip.on{background:var(--green-tint);color:#00A05B}
.chip.off{background:var(--g100);color:var(--g600)}
.chip.done{background:var(--brand-tint);color:var(--brand-press)}
.chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.status{padding:24px 0 8px}
.mcard{position:relative;overflow:hidden;isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black);border-radius:22px;padding:22px 20px;color:#fff;background:linear-gradient(120deg,#FF6B35,#FF8F5E 45%,#FFB08A);margin-top:8px}
.mcard::after{content:"";position:absolute;top:0;bottom:0;left:0;width:60%;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);animation:sheen 2.8s linear infinite;pointer-events:none}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(270%)}}
.mcard>*{position:relative;z-index:1}
.mcard .brand{font-weight:800;font-size:15px;letter-spacing:-.01em;opacity:.95}
.mcard .who{font-size:22px;font-weight:800;margin-top:14px;letter-spacing:-.02em}
.mcard .clock{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
.mcard .date{font-size:13px;opacity:.9;margin-top:2px}
.mcard .pill{display:inline-block;margin-top:14px;background:rgba(255,255,255,.22);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;backdrop-filter:blur(4px)}
.mcard.off{background:linear-gradient(120deg,#8B95A1,#B0B8C1)}
.mcard.done{background:linear-gradient(120deg,#333D4B,#4E5968)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end}
.sheet .box{background:#fff;width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px;font-size:18px}
.status .big{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.3;margin-top:12px}
.status .sub{margin-top:6px}
.list{margin:0 -20px}
.row{display:flex;align-items:center;gap:14px;padding:16px 20px;text-decoration:none;color:inherit;transition:background .08s}
.row:active{background:var(--g50)}
.ic{width:44px;height:44px;border-radius:14px;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.ic.on{background:var(--brand-tint)}
.row .t{flex:1;min-width:0}
.row .n{font-size:16px;font-weight:600;color:var(--g900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:13px;color:var(--g500);margin-top:2px}
.row .r{font-size:15px;font-weight:700;color:var(--brand);flex:none}
.row .chev{color:var(--g300);flex:none;margin-left:-4px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--g200);font-size:15px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--g600)}
.kv .v{font-weight:600;text-align:right}
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--g100);display:flex;max-width:480px;margin:0 auto;z-index:20}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--g400);text-decoration:none;font-weight:500}
.nav a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:var(--g900)}
#reader{width:100%;border-radius:20px;overflow:hidden;background:#000;min-height:300px;margin-top:16px}
#reader video{border-radius:20px}
.result{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom));text-align:center;z-index:50;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.mark{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:pop .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.mark.ok{background:var(--brand)}
.mark.bad{background:var(--g100)}
.mark svg{width:44px;height:44px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.mark.bad svg{stroke:var(--g600)}
.minicard{position:relative;overflow:hidden;isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black);width:100%;max-width:340px;text-align:left;background:linear-gradient(120deg,var(--brand),#FF8F5E 45%,#FFB08A);color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:18px;box-shadow:0 6px 18px rgba(255,107,53,.3)}
.minicard::after{content:"";position:absolute;top:0;bottom:0;left:0;width:60%;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);animation:sheen 2.2s linear infinite;pointer-events:none}
.minicard>*{position:relative;z-index:1}
.minicard .b{font-size:12px;font-weight:800;opacity:.95;display:flex;justify-content:space-between;align-items:center}
.minicard .b .v{font-size:11px;background:rgba(255,255,255,.25);border-radius:999px;padding:3px 8px}
.minicard .p{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:8px}
.minicard .s{font-size:12px;opacity:.9;margin-top:2px}
.result .clock{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--g900);line-height:1.1}
.result .meta{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.result .meta span{background:var(--g100);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--g800)}
.result .meta b{color:var(--brand)}
.undo{margin-top:10px;font-size:13px;color:var(--g500);text-decoration:underline;background:none;border:0;font-family:inherit;cursor:pointer}
.confirm .box h3{font-size:19px;margin-bottom:4px}
.confirm .dist{display:inline-block;margin:6px 0 14px;font-size:13px;font-weight:700;border-radius:8px;padding:5px 10px;background:var(--g100);color:var(--g700)}
.confirm .dist.far{background:var(--red-tint);color:var(--red)}
.result .amt{font-size:40px;font-weight:800;letter-spacing:-.03em;color:var(--g900);line-height:1.1}
.result .st{font-size:22px;font-weight:700;margin-top:10px}
.result .tm{font-size:15px;color:var(--g600);margin-top:8px;line-height:1.5}
.result .show{margin-top:28px;background:var(--brand-tint);color:var(--brand-press);border-radius:14px;padding:14px 18px;font-weight:600;font-size:15px;width:100%}
.result .cnt{margin-top:14px;font-size:13px;color:var(--g500)}
.result .btn{position:absolute;left:20px;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:auto}
.code{font-family:inherit;font-size:30px;font-weight:800;letter-spacing:.12em;text-align:center;padding:18px 0 6px;color:var(--g900)}
.strike{text-decoration:line-through;color:var(--g400);font-weight:400;margin-right:6px}
.center{text-align:center}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.step{display:flex;gap:12px;padding:10px 0;align-items:flex-start}
.step b{width:24px;height:24px;border-radius:50%;background:var(--g900);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.step span{color:var(--g700);font-size:14px;line-height:1.5}
.spin{display:flex;justify-content:center;padding:80px 0}
.spin i{width:28px;height:28px;border:3px solid var(--g200);border-top-color:var(--brand);border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.seg{display:flex;background:var(--g100);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;height:36px;border:0;border-radius:9px;background:transparent;font:inherit;font-size:14px;font-weight:600;color:var(--g500);cursor:pointer;font-family:inherit}
.seg button.on{background:#fff;color:var(--g900);box-shadow:0 1px 3px rgba(0,0,0,.08)}
#map{height:340px;border-radius:20px;overflow:hidden;background:var(--g100);position:relative;z-index:0}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--brand);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.pin.off{background:var(--g400)}
.pin span{transform:rotate(45deg);font-size:15px}
.pinwrap{position:relative;width:34px;height:34px}
.pinlbl{position:absolute;top:36px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;color:var(--g900);font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.2);pointer-events:none;letter-spacing:-.01em}
.pinlbl.off{color:var(--g500)}
.me{width:16px;height:16px;border-radius:50%;background:#3182F6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(49,130,246,.2)}
.leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.12);font-family:inherit}
.leaflet-popup-content{margin:12px 14px;font-size:14px;line-height:1.4}
.leaflet-popup-content b{font-size:15px}
.leaflet-popup-content a{display:inline-block;margin-top:8px;color:var(--brand);font-weight:700;text-decoration:none}
.leaflet-container{font-family:inherit}
.locbtn{position:absolute;right:12px;bottom:12px;z-index:500;width:40px;height:40px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:18px;cursor:pointer}
.empty{padding:32px 0;text-align:center;color:var(--g500);font-size:14px}
</style>
</head>

<script>
const API = "https://zthrcavaccgtvsyffpeh.supabase.co/functions/v1/api";
const TOSS_CLIENT_KEY = "test_ck_Z1aOwX7K8mBqgaxkbdAP3yQxzvNP";
const CHAT_URL = "https://open.kakao.com/o/ssiAtQPi";
const KAKAO_JS_KEY = ""; // 동원님에게 받으면 입력 → 카톡 직접 열림
try { if (KAKAO_JS_KEY && window.Kakao && !Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY); } catch {}
const $ = (s) => document.querySelector(s);
const app = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = (n) => Number(n).toLocaleString("ko-KR") + "원";
const store = { get token(){ return localStorage.getItem("rabap_token"); }, set token(v){ v ? localStorage.setItem("rabap_token", v) : localStorage.removeItem("rabap_token"); } };
function deviceId(){ let d = localStorage.getItem("rabap_dev"); if(!d){ d = crypto.randomUUID(); localStorage.setItem("rabap_dev", d); } return d; }
async function api(action, body={}){
  const r = await fetch(API, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ action, token: store.token, ...body }) });
  const j = await r.json().catch(() => ({ ok:false, reason:"서버 응답 오류" }));
  if (r.status === 401) { store.token = null; go("/join"); }
  return j;
}
function go(path){ if (location.hash === "#" + path) { render(); } else { location.hash = "#" + path; } }
function route(){ const h = location.hash.replace(/^#/, "") || "/"; const [path, q] = h.split("?"); return { path, q: new URLSearchParams(q || "") }; }
let scanner = null;
async function stopScanner(){ if (scanner) { try { await scanner.stop(); scanner.clear(); } catch {} scanner = null; } }
const loading = () => `<div class="spin"><i></i></div>`;
function toast(msg){ const t = document.createElement("div"); t.textContent = msg; t.style.cssText = "position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#191F28;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:99;max-width:90%;text-align:center"; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
async function registerCard(me){
  const customerKey = me.membership?.customer_key || crypto.randomUUID();
  localStorage.setItem("rabap_ck", customerKey);
  const base = location.origin + location.pathname;
  try {
    const payment = TossPayments(TOSS_CLIENT_KEY).payment({ customerKey });
    await payment.requestBillingAuth({ method: "CARD", successUrl: base + "?billing=ok", failUrl: base + "?billing=fail", customerName: "라밥 회원" });
  } catch (e) { if (e?.code !== "USER_CANCEL") toast("카드 등록 창을 열 수 없어요: " + (e?.message || e)); }
}
async function handleBillingReturn(){
  const q = new URLSearchParams(location.search); if (!q.get("billing")) return false;
  const clean = () => history.replaceState(null, "", location.pathname + "#/history");
  if (q.get("billing") === "ok" && q.get("authKey")) {
    const r = await api("billing_issue", { authKey: q.get("authKey"), customerKey: q.get("customerKey") || localStorage.getItem("rabap_ck") });
    clean(); toast(r.ok ? `카드 등록 완료 · ${r.card}` : r.reason); return true;
  }
  clean(); toast(q.get("message") ? "카드 등록 취소: " + q.get("message") : "카드 등록이 취소됐어요"); return true;
}
const ICON = {
  home:`<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>`,
  qr:`<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 14v0M17 20h3v1"/></svg>`,
  gift:`<svg viewBox="0 0 24 24"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 22V7M12 7c-2-4-7-3-6-1s6 1 6 1zm0 0c2-4 7-3 6-1s-6 1-6 1z"/></svg>`,
  list:`<svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-3-2-2 2-2-2-2 2-2-2-3 2V4a1 1 0 0 1 1-1zM8 8h8M8 12h8M8 16h5"/></svg>`,
  chev:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`,
  back:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`,
  check:`<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  x:`<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>`,
};
function nav(active){
  const it = (p, ic, t) => `<a href="#${p}" class="${active===p?"on":""}">${ICON[ic]}<span>${t}</span></a>`;
  return `<nav class="nav">${it("/","home","홈")}${it("/invite","gift","초대")}${it("/history","list","내역")}</nav>`;
}
const topbar = (href="#/") => `<div class="top"><a class="back" href="${href}">${ICON.back}</a></div>`;

// ---------- 화면 ----------
function visitorId(){ let v = localStorage.getItem("rabap_vis"); if (!v) { v = crypto.randomUUID(); localStorage.setItem("rabap_vis", v); } return v; }
function track(event, code){ try { const k = "rabap_tr_" + event + "_" + (code || ""); if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k, "1"); fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "track", event, code, visitor: visitorId() }) }); } catch {} }
function pageJoin(q){
  const inviteFromLink = q.get("code") || "";
  track(inviteFromLink ? "invite_open" : "join_view", inviteFromLink);
  let step = "phone", isNew = false, mode = null;
  const draw = () => {
    app.innerHTML = `<div class="page">
    <h1 style="margin-top:56px">${step === "phone" ? "라이더님,<br>밥값 3,000원 아끼세요" : "문자로 보낸<br>인증번호를 입력해 주세요"}</h1>

// 확인 시트: 정말 지금 계산하는지
function confirmUse(store, distM){
  return new Promise(res => {
    const el = document.createElement("div"); el.className = "sheet confirm";
    const far = distM != null && distM > 300;
    el.innerHTML = `<div class="box"><h3>${esc(store.name)}에서<br>지금 계산하나요?</h3>
      ${distM != null ? `<span class="dist ${far?"far":""}">${far ? "⚠ " : ""}식당까지 약 ${Math.round(distM)}m${far ? " · 식당 앞이 맞는지 확인해 주세요" : ""}</span>` : `<span class="dist">위치를 확인할 수 없어요 · 식당 앞에서 눌러주세요</span>`}
      <p class="sub">하루 1회라 되돌리기 어려워요. 사장님께 보여드리기 직전에 눌러주세요.</p>
      <button class="btn mt16" id="yes">네, 지금 계산해요</button><button class="btn sub2 mt8" id="no">아니요</button></div>`;
    document.body.appendChild(el);
    const done = (v) => { el.remove(); res(v); };
    el.querySelector("#yes").onclick = () => done(true); el.querySelector("#no").onclick = () => done(false);
    el.onclick = (e) => { if (e.target === el) done(false); };
  });
}
function getPos(){ return new Promise(r => { if (!navigator.geolocation) return r(null); navigator.geolocation.getCurrentPosition(p => r([p.coords.latitude, p.coords.longitude]), () => r(null), { enableHighAccuracy: true, timeout: 5000, maximumAge: 60000 }); }); }
async function useAt(store, me){
  if (!me) me = await getPos();
  const d = (me && store.lat && store.lng) ? L.latLng(me).distanceTo([store.lat, store.lng]) : null;
  if (!(await confirmUse(store, d))) return;
  const r = await api("redeem_at", { store_id: store.id }); showResult(r);
}

// 가까운 식당 자동 선택 → 확인 시트 → 기록
function pickStoreAndUse(stores){
  const open = stores.filter(s => s.open_now);
  const show = (sorted, note) => {
    const el = document.createElement("div"); el.className = "sheet";
    el.innerHTML = `<div class="box"><h3>어느 식당인가요?</h3><p class="cap">${note}</p><div class="list" style="margin:8px -20px 0">${sorted.map(s => `<a class="row" href="javascript:void 0" data-id="${s.id}"><div class="ic on">🍚</div><div class="t"><div class="n">${esc(s.name)}</div><div class="m">${s._d != null ? Math.round(s._d) + "m" : ""}</div></div><span class="chev">${ICON.chev}</span></a>`).join("")}</div><button class="btn sub2 mt16" id="closeSheet">닫기</button></div>`;
    document.body.appendChild(el);
    el.onclick = (e) => { if (e.target === el) el.remove(); };
    el.querySelector("#closeSheet").onclick = () => el.remove();
    el.querySelectorAll("[data-id]").forEach(a => a.onclick = async () => { el.remove(); const st = sorted.find(x => x.id === a.dataset.id); useAt(st, window._me || null); });
  };
  const list = open.length ? open : stores;
  if (!navigator.geolocation) return show(list, "식당을 선택하세요");
  navigator.geolocation.getCurrentPosition(p => {
    const me = [p.coords.latitude, p.coords.longitude]; window._me = me;
    const withD = list.map(s => ({ ...s, _d: (s.lat && s.lng) ? L.latLng(me).distanceTo([s.lat, s.lng]) : null })).sort((a, b) => (a._d ?? 1e9) - (b._d ?? 1e9));
    show(withD, "가까운 순이에요");
  }, () => show(list, "식당을 선택하세요"), { enableHighAccuracy: true, timeout: 5000, maximumAge: 60000 });
}

let map = null;
function renderMap(stores){
  const el = $("#map"); if (!el) return;
  if (map) { map.remove(); map = null; }
  map = L.map("map", { zoomControl: false, attributionControl: false }).setView([37.4784, 126.9516], 14);
  const ESRI = "https://tile.openstreetmap.de/{z}/{x}/{y}.png";
  const useEsri = () => { L.tileLayer(ESRI, { maxZoom: 19 }).addTo(map); L.control.attribution({ prefix: false }).addAttribution("© OpenStreetMap").addTo(map); };
  if (window._tileOk === false) useEsri();
  else {
    const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
    const attr = L.control.attribution({ prefix: false }).addAttribution("© OpenStreetMap").addTo(map);
    if (window._tileOk === undefined) fetch("https://tile.openstreetmap.org/14/13969/6490.png", { mode: "cors" }).then(r => { window._tileOk = r.ok; if (!r.ok) { map.removeLayer(osm); attr.remove(); useEsri(); } }).catch(() => {});
  }
  const pts = stores.filter(s => s.lat && s.lng);
  pts.forEach(s => {
    const short = s.name.replace(/\s*(서울대입구역?점|봉천점|신림점|낙성대점|관악점|관악본점|본점)$/, "");
    const icon = L.divIcon({ className: "", html: `<div class="pinwrap"><div class="pin ${s.open_now?"":"off"}"><span>🍚</span></div><div class="pinlbl ${s.open_now?"":"off"}">${esc(short)}</div></div>`, iconSize: [34, 34], iconAnchor: [17, 34], popupAnchor: [0, -34] });
    L.marker([s.lat, s.lng], { icon }).addTo(map)
      .bindPopup(`<b>${esc(s.name)}</b><br><span style="color:#6B7684">${s.closed_today ? "오늘 휴무" : s.open_now ? "영업 중" : "영업시간 아님"} · 3,000원 할인 (${won(s.min_order_krw || 8000)} 이상)</span><br><a href="#/store/${s.id}">자세히 보기 ›</a>`);
  });
  if (pts.length) map.fitBounds(L.latLngBounds(pts.map(s => [s.lat, s.lng])).pad(0.3), { maxZoom: 16 });
  let meMarker = null;
  const locate = (quiet) => navigator.geolocation?.getCurrentPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude]; window._me = ll;
    if (meMarker) meMarker.remove();
    meMarker = L.marker(ll, { icon: L.divIcon({ className: "", html: `<div class="me"></div>`, iconSize: [16, 16], iconAnchor: [8, 8] }), zIndexOffset: 1000 }).addTo(map);
    if (pts.length) map.fitBounds(L.latLngBounds([ll, ...pts.map(s => [s.lat, s.lng])]).pad(0.25), { maxZoom: 16 }); else map.setView(ll, 15);
  }, () => { if (!quiet) alert("위치 권한을 허용해 주세요"); }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
  const btn = document.createElement("button"); btn.className = "locbtn"; btn.textContent = "◎"; btn.title = "내 위치";
  btn.onclick = () => locate(false);
  el.appendChild(btn);
  if (window._me) { const ll = window._me; meMarker = L.marker(ll, { icon: L.divIcon({ className: "", html: `<div class="me"></div>`, iconSize: [16, 16], iconAnchor: [8, 8] }), zIndexOffset: 1000 }).addTo(map); if (pts.length) map.fitBounds(L.latLngBounds([ll, ...pts.map(s => [s.lat, s.lng])]).pad(0.25), { maxZoom: 16 }); }
  locate(true);
  setTimeout(() => map.invalidateSize(), 50);
}

  const close = () => { el.remove(); if (t) clearInterval(t); go("/"); };
  el.querySelector(".btn").onclick = close;
  const u = el.querySelector("#undo"); if (u) u.onclick = async () => { u.disabled = true; const x = await api("undo"); toast(x.ok ? "취소됐어요. 오늘 다시 쓸 수 있어요" : x.reason); if (x.ok) close(); else u.disabled = false; };
  const tick = () => { const l = el.querySelector("#live"); if (l) { const d = new Date(); l.textContent = `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`; } };
  tick();
  let n = 30; const t = r.ok ? setInterval(() => { n--; tick(); const c = el.querySelector("#c"); if (c) c.textContent = n; if (n <= 0) close(); }, 1000) : null;
}

async function pageScan(){
  app.innerHTML = `<div class="page">
    ${topbar("#/")}
    <h1>식당 QR을 찍어주세요</h1>
    <p class="sub">카운터에 붙은 라밥 스티커예요</p>
    <div id="reader"></div>
    <div id="err" class="err"></div>
    <p class="cap center mt16">카메라가 안 열리면 브라우저 설정에서 카메라 권한을 허용해 주세요</p>
  </div>${nav("/scan")}`;
  let busy = false;
  try {
    scanner = new Html5Qrcode("reader");
    await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 230, height: 230 } }, async (text) => {
      if (busy) return; busy = true;
      await stopScanner();
      const r = await api("redeem", { secret: text });
      showResult(r);
    });
  } catch (e) { $("#err").textContent = "카메라를 열 수 없어요: " + (e?.message || e); }
}

async function pageInvite(){
  app.innerHTML = `<div class="page">${loading()}</div>${nav("/invite")}`;
  const me = await api("me"); if (!me.ok) return;
  const inv = me.invite || { code: "-", used_count: 0, max_uses: 0 };
  const link = `${location.origin}${location.pathname}#/join?code=${inv.code}`;
  const msg = `라밥 초대장 🍚\n관악 라이더끼리 제휴 식당에서 매끼 3,000원 할인받는 멤버십이에요. 초대받은 라이더만 가입할 수 있고, 첫 주 무료. 친구 초대마다 1주 연장.\n초대 코드: ${inv.code}\n${link}`;
  app.innerHTML = `<div class="page">
    <h1 style="margin-top:28px">같이 뛰는 동료를<br>초대해 보세요</h1>
    <p class="sub">라밥은 초대받은 라이더만 가입할 수 있어요.<br>친구가 가입하면 내 무료 기간이 7일 늘어나요 (최대 5명, 35일).</p>
    <div class="sec mt24 center">
      <div class="cap">내 초대 코드</div>
      <div class="code">${esc(inv.code)}</div>
      <div class="cap">${inv.used_count}명 가입 · +${Math.min(inv.used_count, 5) * 7}일 받음 · ${Math.max(inv.max_uses - inv.used_count, 0)}자리 남음</div>
    </div>
    <button class="btn mt16" id="share">${KAKAO_JS_KEY ? "카카오톡으로 초대하기" : "초대 링크 보내기"}</button>
    <button class="btn sub2 mt8" id="copy">링크 복사</button>
  </div>${nav("/invite")}`;
  $("#share").onclick = async () => {
    if (KAKAO_JS_KEY && window.Kakao?.isInitialized()) { // 카톡 직접 열기
      try { Kakao.Share.sendDefault({ objectType: "text", text: msg.replace(link, "").trim(), link: { mobileWebUrl: link, webUrl: link }, buttonTitle: "라밥 시작하기" }); return; } catch {}
    }
    if (navigator.share) { try { await navigator.share({ text: msg }); } catch {} } else { await navigator.clipboard.writeText(msg); toast("초대 문구를 복사했어요. 카톡에 붙여넣으세요."); }
  };
  $("#copy").onclick = async () => { await navigator.clipboard.writeText(link); alert("링크를 복사했어요"); };
}

async function pageHistory(){
  app.innerHTML = `<div class="page">${loading()}</div>${nav("/history")}`;
  const [me, h] = await Promise.all([api("me"), api("history")]);
  if (!me.ok) return;
  const total = (h.items || []).reduce((a, x) => a + x.krw, 0);
  const rows = (h.items || []).map(x => { const d = new Date(x.at); return `<div class="row" style="padding-left:0;padding-right:0"><div class="ic">🍚</div><div class="t"><div class="n">${esc(x.store)}</div><div class="m">${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}</div></div><div class="r" style="color:var(--g900)">-${won(x.krw)}</div></div>`; }).join("");
  const m = me.membership; const end = m ? new Date(m.period_end) : null;
  app.innerHTML = `<div class="page">
    <div class="status"><span class="cap">지금까지 아낀 돈</span><div class="big" style="font-size:34px;margin-top:6px">${won(total)}</div><p class="sub">${me.total_count}번 할인받았어요</p></div>
    <h2>이용 내역</h2>
    ${rows || `<div class="empty">아직 사용 내역이 없어요</div>`}
    <h2>멤버십</h2>
    <div class="sec">
      <div class="kv"><span class="k">번호</span><span class="v">${esc(me.phone_masked)}</span></div>
      <div class="kv"><span class="k">상태</span><span class="v">${m?.status === "past_due" ? '<span style="color:var(--red)">결제 실패 · 결제수단을 확인해 주세요</span>' : m?.live ? (m.card ? "이용 중" : "이용 중 · 무료 기간") : "만료"}</span></div>
      <div class="kv"><span class="k">무료 기간</span><span class="v">${end ? `${end.getMonth()+1}월 ${end.getDate()}일까지` : "-"}</span></div>
      <div class="kv"><span class="k">이후 요금</span><span class="v">월 3,000원</span></div>
      <div class="kv"><span class="k">결제 카드</span><span class="v">${m?.card ? esc(m.card) : '<span style="color:var(--g400);font-weight:400">미등록</span>'}</span></div>
    </div>
    ${m?.status === "canceled" ? `<p class="cap mt8">해지 예약됨 · ${end ? `${end.getMonth()+1}월 ${end.getDate()}일` : ""}까지 이용 가능</p><button class="btn sub2 mt8" id="resume">해지 취소</button>`
      : `${m?.card ? `<button class="btn sub2 mt16" id="rmCard">카드 변경</button>` : `<button class="btn mt16" id="addCard">결제 카드 등록</button><p class="cap center mt8">등록해 두면 무료가 끝나도 끊기지 않아요. 지금은 결제되지 않아요.</p>`}
         <button class="btn line mt8" id="cancel" style="color:var(--g500)">멤버십 해지</button>`}
    <a class="btn sub2 mt24" href="${CHAT_URL}" target="_blank">문의·건의는 라밥 라이더 오픈채팅</a>
    <p class="cap center mt16"><a href="terms.html" style="color:var(--g500)">이용약관</a> · <a href="privacy.html" style="color:var(--g500)">개인정보처리방침</a> · yslee@doeat.io</p>
  </div>${nav("/history")}`;
  const bind = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  bind("#addCard", () => registerCard(me));
  bind("#rmCard", () => registerCard(me));
  bind("#cancel", async () => { if (!confirm("멤버십을 해지할까요? 남은 기간까지는 계속 쓸 수 있어요.")) return; const r = await api("cancel"); toast(r.ok ? "해지 예약됐어요" : r.reason); pageHistory(); });
  bind("#resume", async () => { const r = await api("resume"); toast(r.ok ? "해지가 취소됐어요" : r.reason); pageHistory(); });
}

// ---------- 라우터 ----------
async function render(){
  await stopScanner();
  window.scrollTo(0, 0);
  if (store.token && await handleBillingReturn()) { location.hash = "#/history"; }
  const { path, q } = route();
  if (path.startsWith("/s/")) {
    if (!store.token) return go("/join");
    const r = await api("redeem", { secret: path.slice(3) }); showResult(r); return;
  }
  if (!store.token) return pageJoin(q);
  if (path === "/join") return go("/");
  if (path === "/scan") return pageScan();
  if (path === "/invite") return pageInvite();
  if (path === "/history") return pageHistory();
  if (path.startsWith("/store/")) return pageStore(path.slice(7));
  return pageHome();
}
window.addEventListener("hashchange", render);
render();
</script>
