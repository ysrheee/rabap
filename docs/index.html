<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>라밥</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --brand:#FF6B35;--brand-press:#E85A26;--brand-tint:#FFF1EB;
  --g900:#191F28;--g800:#333D4B;--g700:#4E5968;--g600:#6B7684;--g500:#8B95A1;--g400:#B0B8C1;--g300:#D1D6DB;--g200:#E5E8EB;--g100:#F2F4F6;--g50:#F9FAFB;
  --green:#00C471;--green-tint:#E8F9F1;--red:#F04452;--red-tint:#FDEDEE;
  --r:16px;--nav:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--g900);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;font-size:15px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
#app{max-width:480px;margin:0 auto;min-height:100vh}
.page{padding:12px 20px 32px}
.top{display:flex;align-items:center;height:52px;margin:0 -4px}
.back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--g800);text-decoration:none;border-radius:50%}
.back:active{background:var(--g100)}
h1{font-size:24px;line-height:1.35;margin:16px 0 6px;font-weight:700;letter-spacing:-.02em}
h2{font-size:17px;margin:28px 0 12px;font-weight:700}
p{margin:0}
.sub{color:var(--g600);font-size:14px}
.cap{color:var(--g500);font-size:13px}
.sec{background:var(--g100);border-radius:20px;padding:20px;margin-top:16px}
.sec.white{background:#fff;border:1px solid var(--g200)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border:0;border-radius:14px;font-size:17px;font-weight:600;background:var(--brand);color:#fff;text-decoration:none;cursor:pointer;transition:transform .08s,background .08s;font-family:inherit}
.btn:active{background:var(--brand-press);transform:scale(.985)}
.btn.sub2{background:var(--g100);color:var(--g800)}
.btn.sub2:active{background:var(--g200)}
.btn.line{background:#fff;color:var(--g800);border:1px solid var(--g200);height:50px;font-size:15px}
.btn:disabled{background:var(--g200);color:var(--g400);transform:none}
.cta{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,#fff 70%,rgba(255,255,255,0));max-width:480px;margin:0 auto}
.cta.nav-on{bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
.field{margin-top:18px}
.field label{display:block;font-size:13px;color:var(--g600);margin-bottom:8px;font-weight:500}
.field input{width:100%;height:56px;border:2px solid transparent;border-radius:14px;padding:0 16px;font-size:18px;font-weight:500;background:var(--g100);outline:0;color:var(--g900);font-family:inherit;transition:border-color .12s,background .12s}
.field input:focus{border-color:var(--brand);background:#fff}
.field input::placeholder{color:var(--g400);font-weight:400}
.err{color:var(--red);font-size:13px;margin-top:10px;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
.chip.on{background:var(--green-tint);color:#00A05B}
.chip.off{background:var(--g100);color:var(--g600)}
.chip.done{background:var(--brand-tint);color:var(--brand-press)}
.chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.status{padding:24px 0 8px}
.status .big{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.3;margin-top:12px}
.status .sub{margin-top:6px}
.list{margin:0 -20px}
.row{display:flex;align-items:center;gap:14px;padding:16px 20px;text-decoration:none;color:inherit;transition:background .08s}
.row:active{background:var(--g50)}
.ic{width:44px;height:44px;border-radius:14px;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.ic.on{background:var(--brand-tint)}
.row .t{flex:1;min-width:0}
.row .n{font-size:16px;font-weight:600;color:var(--g900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:13px;color:var(--g500);margin-top:2px}
.row .r{font-size:15px;font-weight:700;color:var(--brand);flex:none}
.row .chev{color:var(--g300);flex:none;margin-left:-4px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--g200);font-size:15px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--g600)}
.kv .v{font-weight:600;text-align:right}
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--g100);display:flex;max-width:480px;margin:0 auto;z-index:20}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--g400);text-decoration:none;font-weight:500}
.nav a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:var(--g900)}
#reader{width:100%;border-radius:20px;overflow:hidden;background:#000;min-height:300px;margin-top:16px}
#reader video{border-radius:20px}
.result{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom));text-align:center;z-index:50;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.mark{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:pop .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.mark.ok{background:var(--brand)}
.mark.bad{background:var(--g100)}
.mark svg{width:44px;height:44px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.mark.bad svg{stroke:var(--g600)}
.result .amt{font-size:40px;font-weight:800;letter-spacing:-.03em;color:var(--g900);line-height:1.1}
.result .st{font-size:22px;font-weight:700;margin-top:10px}
.result .tm{font-size:15px;color:var(--g600);margin-top:8px;line-height:1.5}
.result .show{margin-top:28px;background:var(--brand-tint);color:var(--brand-press);border-radius:14px;padding:14px 18px;font-weight:600;font-size:15px;width:100%}
.result .cnt{margin-top:14px;font-size:13px;color:var(--g500)}
.result .btn{position:absolute;left:20px;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:auto}
.code{font-family:inherit;font-size:30px;font-weight:800;letter-spacing:.12em;text-align:center;padding:18px 0 6px;color:var(--g900)}
.strike{text-decoration:line-through;color:var(--g400);font-weight:400;margin-right:6px}
.center{text-align:center}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.step{display:flex;gap:12px;padding:10px 0;align-items:flex-start}
.step b{width:24px;height:24px;border-radius:50%;background:var(--g900);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.step span{color:var(--g700);font-size:14px;line-height:1.5}
.spin{display:flex;justify-content:center;padding:80px 0}
.spin i{width:28px;height:28px;border:3px solid var(--g200);border-top-color:var(--brand);border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.seg{display:flex;background:var(--g100);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;height:36px;border:0;border-radius:9px;background:transparent;font:inherit;font-size:14px;font-weight:600;color:var(--g500);cursor:pointer;font-family:inherit}
.seg button.on{background:#fff;color:var(--g900);box-shadow:0 1px 3px rgba(0,0,0,.08)}
#map{height:340px;border-radius:20px;overflow:hidden;background:var(--g100);position:relative;z-index:0}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--brand);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.pin.off{background:var(--g400)}
.pin span{transform:rotate(45deg);font-size:15px}
.me{width:16px;height:16px;border-radius:50%;background:#3182F6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(49,130,246,.2)}
.leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.12);font-family:inherit}
.leaflet-popup-content{margin:12px 14px;font-size:14px;line-height:1.4}
.leaflet-popup-content b{font-size:15px}
.leaflet-popup-content a{display:inline-block;margin-top:8px;color:var(--brand);font-weight:700;text-decoration:none}
.leaflet-container{font-family:inherit}
.locbtn{position:absolute;right:12px;bottom:12px;z-index:500;width:40px;height:40px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:18px;cursor:pointer}
.empty{padding:32px 0;text-align:center;color:var(--g500);font-size:14px}
</style>
</head>
<body>
<div id="app"><div class="spin"><i></i></div></div>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API = "https://zthrcavaccgtvsyffpeh.supabase.co/functions/v1/api";
const $ = (s) => document.querySelector(s);
const app = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = (n) => Number(n).toLocaleString("ko-KR") + "원";
const store = { get token(){ return localStorage.getItem("rabap_token"); }, set token(v){ v ? localStorage.setItem("rabap_token", v) : localStorage.removeItem("rabap_token"); } };
function deviceId(){ let d = localStorage.getItem("rabap_dev"); if(!d){ d = crypto.randomUUID(); localStorage.setItem("rabap_dev", d); } return d; }
async function api(action, body={}){
  const r = await fetch(API, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ action, token: store.token, ...body }) });
  const j = await r.json().catch(() => ({ ok:false, reason:"서버 응답 오류" }));
  if (r.status === 401) { store.token = null; go("/join"); }
  return j;
}
function go(path){ location.hash = "#" + path; }
function route(){ const h = location.hash.replace(/^#/, "") || "/"; const [path, q] = h.split("?"); return { path, q: new URLSearchParams(q || "") }; }
let scanner = null;
async function stopScanner(){ if (scanner) { try { await scanner.stop(); scanner.clear(); } catch {} scanner = null; } }
const loading = () => `<div class="spin"><i></i></div>`;
const ICON = {
  home:`<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>`,
  qr:`<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 14v0M17 20h3v1"/></svg>`,
  gift:`<svg viewBox="0 0 24 24"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 22V7M12 7c-2-4-7-3-6-1s6 1 6 1zm0 0c2-4 7-3 6-1s-6 1-6 1z"/></svg>`,
  list:`<svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-3-2-2 2-2-2-2 2-2-2-3 2V4a1 1 0 0 1 1-1zM8 8h8M8 12h8M8 16h5"/></svg>`,
  chev:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`,
  back:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`,
  check:`<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  x:`<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>`,
};
function nav(active){
  const it = (p, ic, t) => `<a href="#${p}" class="${active===p?"on":""}">${ICON[ic]}<span>${t}</span></a>`;
  return `<nav class="nav">${it("/","home","홈")}${it("/scan","qr","QR 할인")}${it("/invite","gift","초대")}${it("/history","list","내역")}</nav>`;
}
const topbar = (href="#/") => `<div class="top"><a class="back" href="${href}">${ICON.back}</a></div>`;

// ---------- 화면 ----------
function pageJoin(q){
  const inviteFromLink = q.get("code") || "";
  let step = "phone", isNew = false, mode = null;
  const draw = () => {
    app.innerHTML = `<div class="page">
    <h1 style="margin-top:56px">${step === "phone" ? "라이더님,<br>밥값 3,000원 아끼세요" : "문자로 보낸<br>인증번호를 입력해 주세요"}</h1>
    <p class="sub">${step === "phone" ? "관악구 제휴 식당에서 비피크 시간에 매끼 할인" : `${$("#phone")?.value || phoneVal} 로 보냈어요`}</p>
    <div class="field" style="margin-top:36px${step === "phone" ? "" : ";display:none"}"><label>휴대폰 번호</label><input id="phone" type="tel" placeholder="010-0000-0000" inputmode="numeric" value="${esc(phoneVal)}"></div>
    ${step === "otp" ? `<div class="field" style="margin-top:36px"><label>인증번호</label><input id="otp" type="tel" placeholder="6자리" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>` : ""}
    <div class="field" id="codeWrap" style="${(step === "phone" && !inviteFromLink) || (step === "otp" && !isNew) ? "display:none" : ""}"><label>초대 코드 <span style="color:var(--g400);font-weight:400">· 처음 가입할 때만</span></label><input id="code" value="${esc(codeVal)}" placeholder="8자리 코드" autocapitalize="characters" autocomplete="off"></div>
    <div id="err" class="err"></div>
    ${step === "phone" ? `<div class="sec" style="margin-top:28px">
      <div class="step"><b>1</b><span>초대 코드로 시작하면 첫 달 무료예요</span></div>
      <div class="step"><b>2</b><span>할인 시간(14~17시, 20~24시)에 제휴 식당 방문</span></div>
      <div class="step"><b>3</b><span>카운터 QR을 찍고 할인 화면을 보여주면 끝</span></div>
    </div>
    <p class="cap center mt24">시작하면 <a href="privacy.html" style="color:var(--g500)">개인정보처리방침</a>에 동의한 것으로 봐요.<br>첫 달 무료, 이후 월 1,000원 (정가 3,000원)</p>` : `<button class="btn line mt24" id="resend">인증번호 다시 받기</button>`}
    <div style="height:72px"></div>
  </div>
  <div class="cta"><button class="btn" id="go">${step === "phone" ? "시작하기" : "확인"}</button></div>`;
    $("#go").onclick = submit; if ($("#resend")) $("#resend").onclick = () => { step = "phone"; draw(); };
    ($("#otp") || $("#phone"))?.focus();
  };
  let phoneVal = "", codeVal = inviteFromLink;
  const busy = (on, label) => { const b = $("#go"); b.disabled = on; b.textContent = label; };
  async function submit(){
    $("#err").textContent = "";
    phoneVal = $("#phone")?.value || phoneVal; codeVal = $("#code")?.value || codeVal;
    if (step === "phone") {
      busy(true, "확인 중…");
      const r = await api("start", { phone: phoneVal, code: codeVal });
      if (!r.ok) { $("#err").textContent = r.reason; busy(false, "시작하기"); return; }
      if (r.token) { store.token = r.token; return go("/"); }
      if (r.mode === "direct" && r.is_new) { isNew = true; $("#codeWrap").style.display = ""; $("#err").textContent = "처음이시네요. 초대 코드를 입력해 주세요"; busy(false, "시작하기"); $("#code").focus(); return; }
      mode = r.mode; isNew = !!r.is_new; step = "otp"; draw(); return;
    }
    busy(true, "확인 중…");
    const r = await api("verify", { phone: phoneVal, otp: $("#otp").value, code: codeVal });
    if (r.ok) { store.token = r.token; go("/"); } else { $("#err").textContent = r.reason; busy(false, "확인"); }
  }
  draw();
}

async function pageHome(){
  app.innerHTML = `<div class="page">${loading()}</div>${nav("/")}`;
  const [me, st] = await Promise.all([api("me"), api("stores")]);
  if (!me.ok) return;
  let chip, title, sub;
  if (me.used_today) { chip = `<span class="chip done">오늘 사용 완료</span>`; title = `오늘 3,000원 아꼈어요`; sub = `${esc(me.used_today.store)} · 내일 14시부터 다시 할인`; }
  else if (!me.membership?.live) { chip = `<span class="chip off">멤버십 만료</span>`; title = "멤버십이 만료됐어요"; sub = "라밥 카톡채널로 문의해 주세요"; }
  else if (me.in_window) { chip = `<span class="chip on"><i class="d"></i>지금 할인 가능</span>`; title = "지금 식당 가면<br>3,000원 할인이에요"; sub = `현재 ${me.now} · 하루 1회`; }
  else { chip = `<span class="chip off">할인 시간 아님</span>`; title = me.next_window ? `${me.next_window}부터<br>할인 시간이에요` : "오늘 할인 시간은<br>끝났어요"; sub = me.next_window ? `현재 ${me.now} · 미리 식당을 골라두세요` : "내일 14:00부터 다시 시작"; }
  const canScan = me.membership?.live && me.in_window && !me.used_today;
  const rows = (st.stores || []).map(s => `<a class="row" href="#/store/${s.id}">
      <div class="ic ${s.open_now?"on":""}">🍚</div>
      <div class="t"><div class="n">${esc(s.name)}</div>
      <div class="m">${s.open_now ? "영업 중" : "영업시간 아님"}${s.menu_note ? " · " + esc(s.menu_note) : ""}</div></div>
      <div class="r">-3,000원</div><span class="chev">${ICON.chev}</span></a>`).join("");
  app.innerHTML = `<div class="page">
    <div class="status">${chip}<div class="big">${title}</div><p class="sub">${sub}</p></div>
    ${canScan ? `<a class="btn mt16" href="#/scan">QR 찍고 할인받기</a>` : ""}
    <h2>제휴 식당 <span class="cap" style="font-weight:500">${(st.stores||[]).length}</span></h2>
    <div class="seg"><button id="segList">목록</button><button id="segMap">지도</button></div>
    <div id="viewList" class="list">${rows || `<div class="empty">제휴 식당을 준비하고 있어요</div>`}</div>
    <div id="viewMap" style="display:none"><div id="map"></div><p class="cap center mt8">핀을 누르면 식당 정보가 보여요</p></div>
  </div>${nav("/")}`;
  window._stores = st.stores || [];
  const setView = (v) => {
    localStorage.setItem("rabap_view", v);
    $("#segList").classList.toggle("on", v === "list"); $("#segMap").classList.toggle("on", v === "map");
    $("#viewList").style.display = v === "list" ? "" : "none"; $("#viewMap").style.display = v === "map" ? "" : "none";
    if (v === "map") renderMap(window._stores);
  };
  $("#segList").onclick = () => setView("list"); $("#segMap").onclick = () => setView("map");
  setView(localStorage.getItem("rabap_view") || "list");
}

let map = null;
function renderMap(stores){
  const el = $("#map"); if (!el) return;
  if (map) { map.remove(); map = null; }
  map = L.map("map", { zoomControl: false, attributionControl: false }).setView([37.4784, 126.9516], 14);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", { maxZoom: 19, subdomains: "abcd" }).addTo(map);
  L.control.attribution({ prefix: false }).addAttribution("© OpenStreetMap © CARTO").addTo(map);
  const pts = stores.filter(s => s.lat && s.lng);
  pts.forEach(s => {
    const icon = L.divIcon({ className: "", html: `<div class="pin ${s.open_now?"":"off"}"><span>🍚</span></div>`, iconSize: [34, 34], iconAnchor: [17, 34], popupAnchor: [0, -34] });
    L.marker([s.lat, s.lng], { icon }).addTo(map)
      .bindPopup(`<b>${esc(s.name)}</b><br><span style="color:#6B7684">${s.open_now ? "영업 중" : "영업시간 아님"} · -3,000원</span><br><a href="#/store/${s.id}">자세히 보기 ›</a>`);
  });
  if (pts.length) map.fitBounds(L.latLngBounds(pts.map(s => [s.lat, s.lng])).pad(0.3), { maxZoom: 16 });
  const btn = document.createElement("button"); btn.className = "locbtn"; btn.textContent = "◎"; btn.title = "내 위치";
  btn.onclick = () => navigator.geolocation?.getCurrentPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    L.marker(ll, { icon: L.divIcon({ className: "", html: `<div class="me"></div>`, iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(map);
    map.setView(ll, 15);
  }, () => alert("위치 권한을 허용해 주세요"), { enableHighAccuracy: true, timeout: 8000 });
  el.appendChild(btn);
  setTimeout(() => map.invalidateSize(), 50);
}

async function pageStore(id){
  if (!window._stores) { const st = await api("stores"); window._stores = st.stores || []; }
  const s = window._stores.find(x => x.id === id);
  if (!s) return go("/");
  const naver = s.naver_url || `https://map.naver.com/p/search/${encodeURIComponent(s.name + " " + s.address)}`;
  app.innerHTML = `<div class="page">
    ${topbar("#/")}
    <span class="chip ${s.open_now?"on":"off"}">${s.open_now ? '<i class="d"></i>영업 중' : "영업시간 아님"}</span>
    <h1 style="margin-top:12px">${esc(s.name)}</h1>
    <p class="sub">${esc(s.address)}</p>
    <div class="sec mt24">
      <div class="kv"><span class="k">라밥 할인</span><span class="v" style="color:var(--brand)">${won(s.discount_krw)}</span></div>
      <div class="kv"><span class="k">대표 메뉴</span><span class="v">${esc(s.menu_note || "-")}</span></div>
      <div class="kv"><span class="k">오늘 영업</span><span class="v">${s.today_hours.length ? s.today_hours.map(h=>h.join("~")).join("<br>") : "휴무"}</span></div>
      <div class="kv"><span class="k">할인 시간</span><span class="v">14~17시 · 20~24시</span></div>
    </div>
    <div style="display:flex;gap:10px" class="mt16">
      <a class="btn line" href="${naver}" target="_blank">길찾기</a>
      ${s.phone ? `<a class="btn line" href="tel:${esc(s.phone)}">전화</a>` : ""}
    </div>
    <div style="height:88px"></div>
  </div>
  <div class="cta"><a class="btn" href="#/scan">QR 찍고 할인받기</a></div>`;
}

function showResult(r){
  const el = document.createElement("div"); el.className = "result";
  if (r.ok) {
    el.innerHTML = `<div class="mark ok">${ICON.check}</div><div class="amt">-${won(r.discount_krw)}</div><div class="st">${esc(r.store)}</div>
      <div class="tm">${r.now} 할인 적용 완료</div>
      <div class="show">계산할 때 이 화면을 사장님께 보여주세요</div>
      <div class="cnt"><span id="c">20</span>초 후 자동으로 닫혀요</div><button class="btn">확인</button>`;
  } else {
    el.innerHTML = `<div class="mark bad">${ICON.x}</div><div class="st">할인을 적용할 수 없어요</div><div class="tm">${esc(r.reason)}</div><button class="btn sub2">확인</button>`;
  }
  document.body.appendChild(el);
  const close = () => { el.remove(); if (t) clearInterval(t); go("/"); };
  el.querySelector(".btn").onclick = close;
  let n = 20; const t = r.ok ? setInterval(() => { n--; const c = el.querySelector("#c"); if (c) c.textContent = n; if (n <= 0) close(); }, 1000) : null;
}

async function pageScan(){
  app.innerHTML = `<div class="page">
    ${topbar("#/")}
    <h1>식당 QR을 찍어주세요</h1>
    <p class="sub">카운터에 붙은 라밥 스티커예요</p>
    <div id="reader"></div>
    <div id="err" class="err"></div>
    <p class="cap center mt16">카메라가 안 열리면 브라우저 설정에서 카메라 권한을 허용해 주세요</p>
  </div>${nav("/scan")}`;
  let busy = false;
  try {
    scanner = new Html5Qrcode("reader");
    await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 230, height: 230 } }, async (text) => {
      if (busy) return; busy = true;
      await stopScanner();
      const r = await api("redeem", { secret: text });
      showResult(r);
    });
  } catch (e) { $("#err").textContent = "카메라를 열 수 없어요: " + (e?.message || e); }
}

async function pageInvite(){
  app.innerHTML = `<div class="page">${loading()}</div>${nav("/invite")}`;
  const me = await api("me"); if (!me.ok) return;
  const inv = me.invite || { code: "-", used_count: 0, max_uses: 0 };
  const link = `${location.origin}${location.pathname}#/join?code=${inv.code}`;
  const msg = `라밥 초대장 🍚\n관악 라이더끼리 제휴 식당에서 매끼 3,000원 할인받는 앱이에요. 첫 달 무료.\n초대 코드: ${inv.code}\n${link}`;
  app.innerHTML = `<div class="page">
    <h1 style="margin-top:28px">같이 뛰는 동료를<br>초대해 보세요</h1>
    <p class="sub">초대받은 라이더만 가입할 수 있어요. ${inv.max_uses}명까지.</p>
    <div class="sec mt24 center">
      <div class="cap">내 초대 코드</div>
      <div class="code">${esc(inv.code)}</div>
      <div class="cap">${inv.used_count}명 가입 · ${Math.max(inv.max_uses - inv.used_count, 0)}자리 남음</div>
    </div>
    <button class="btn mt16" id="share">카카오톡으로 초대하기</button>
    <button class="btn sub2 mt8" id="copy">링크 복사</button>
  </div>${nav("/invite")}`;
  $("#share").onclick = async () => { if (navigator.share) { try { await navigator.share({ text: msg }); } catch {} } else { await navigator.clipboard.writeText(msg); alert("초대 문구를 복사했어요. 카톡에 붙여넣으세요."); } };
  $("#copy").onclick = async () => { await navigator.clipboard.writeText(link); alert("링크를 복사했어요"); };
}

async function pageHistory(){
  app.innerHTML = `<div class="page">${loading()}</div>${nav("/history")}`;
  const [me, h] = await Promise.all([api("me"), api("history")]);
  if (!me.ok) return;
  const total = (h.items || []).reduce((a, x) => a + x.krw, 0);
  const rows = (h.items || []).map(x => { const d = new Date(x.at); return `<div class="row" style="padding-left:0;padding-right:0"><div class="ic">🍚</div><div class="t"><div class="n">${esc(x.store)}</div><div class="m">${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}</div></div><div class="r" style="color:var(--g900)">-${won(x.krw)}</div></div>`; }).join("");
  const m = me.membership; const end = m ? new Date(m.period_end) : null;
  app.innerHTML = `<div class="page">
    <div class="status"><span class="cap">지금까지 아낀 돈</span><div class="big" style="font-size:34px;margin-top:6px">${won(total)}</div><p class="sub">${me.total_count}번 할인받았어요</p></div>
    <h2>이용 내역</h2>
    ${rows || `<div class="empty">아직 사용 내역이 없어요</div>`}
    <h2>멤버십</h2>
    <div class="sec">
      <div class="kv"><span class="k">번호</span><span class="v">${esc(me.phone_masked)}</span></div>
      <div class="kv"><span class="k">상태</span><span class="v">${m?.live ? "이용 중 · 첫 달 무료" : "만료"}</span></div>
      <div class="kv"><span class="k">무료 기간</span><span class="v">${end ? `${end.getMonth()+1}월 ${end.getDate()}일까지` : "-"}</span></div>
      <div class="kv"><span class="k">이후 요금</span><span class="v"><span class="strike">월 3,000원</span>월 1,000원</span></div>
    </div>
    <p class="cap center mt24">문의·해지는 라밥 카톡채널로</p>
  </div>${nav("/history")}`;
}

// ---------- 라우터 ----------
async function render(){
  await stopScanner();
  const { path, q } = route();
  if (path.startsWith("/s/")) {
    if (!store.token) return go("/join");
    const r = await api("redeem", { secret: path.slice(3) }); showResult(r); return;
  }
  if (!store.token) return pageJoin(q);
  if (path === "/join") return go("/");
  if (path === "/scan") return pageScan();
  if (path === "/invite") return pageInvite();
  if (path === "/history") return pageHistory();
  if (path.startsWith("/store/")) return pageStore(path.slice(7));
  return pageHome();
}
window.addEventListener("hashchange", render);
render();
</script>
